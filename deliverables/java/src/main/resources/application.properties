spring.application.name=vcf400-web
server.port=${VCF_PORT:8080}

# DB2 for i 互換モードの H2 (ファイル永続化。VCF_DB_URL で差し替え可)
spring.datasource.url=${VCF_DB_URL:jdbc:h2:file:./data/vcf400;MODE=DB2;NON_KEYWORDS=VALUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=embedded
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=
spring.h2.console.enabled=${VCF_H2_CONSOLE:false}
spring.h2.console.path=/h2
vcf.db-api.enabled=${VCF_DB_API:false}
# DB API is for cross-validation only; set VCF_DB_API=true when running the validation app.
vcf.seed.admin-password=${VCF_SEED_ADMPSWRD:VCF2024}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Set VCF_COOKIE_SECURE=true when running behind HTTPS.
server.servlet.session.cookie.secure=${VCF_COOKIE_SECURE:false}

spring.thymeleaf.cache=false

# 既定のサインオンプロファイル (= LAUNCH パラメータ / 展示 ID)。MM2024 で共用端末モード
vcf.default-profile=${VCF_PROFILE:ASHIBATA}
