<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('DBVERIFY')}"></head>
<body><div class="screen"><header class="screen-header">DBVERIFY - DATABASE CONTENTS</header>
<main class="screen-body">
<h2>VOTINGDB</h2>
<table><thead><tr><th>BADGENBR</th><th>AWARDNBR</th><th>EXHBNBR</th></tr></thead>
<tbody><tr th:each="vote : ${votes}">
<td th:text="${vote.badgeNbr}"></td><td th:text="${vote.awardNbr}"></td><td th:text="${vote.exhNbr}"></td>
</tr><tr th:if="${#lists.isEmpty(votes)}"><td colspan="3">No rows</td></tr></tbody></table>
<h2>GUESTBKDB</h2>
<table><thead><tr><th>CMTID</th><th>VISIBLE</th><th>EXHBID</th><th>GUESTNAME</th><th>GUESTCMT</th></tr></thead>
<tbody><tr th:each="comment : ${comments}">
<td th:text="${comment.cmtId}"></td><td th:text="${comment.visible}"></td><td th:text="${comment.exhbId}"></td>
<td th:text="${comment.guestName}"></td><td th:text="${comment.guestCmt}"></td>
</tr><tr th:if="${#lists.isEmpty(comments)}"><td colspan="5">No rows</td></tr></tbody></table>
</main><footer class="function-keys"><a href="/">F3=Exit</a></footer></div></body></html>
