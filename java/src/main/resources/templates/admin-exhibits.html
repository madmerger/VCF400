<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('ADMCREATE')}"></head>
<body><div class="screen"><header class="screen-header">ADMCREATE - EXHIBIT ADMINISTRATION</header><main class="screen-body">
<p th:if="${result != null and result.message != null}" th:class="${result.success ? 'success' : 'error'}" th:text="${result.message}"></p><p th:if="${deleteConfirm}" class="error">Confirm deletion with F5.</p><h2>Exhibit list</h2><ul><li th:each="exhibit : ${exhibits}" th:text="${exhibit.exhUsrPrf + ' - ' + exhibit.exhBtitle}"></li></ul>
<form method="post"><label>INUSRPRF <input name="profile" th:value="${editor.profile}"></label><label>INTITLE <input name="title" th:value="${editor.title}"></label><label>INNAME <input name="owner" th:value="${editor.owner}"></label><label>INCITY <input name="city" th:value="${editor.city}"></label><label>INSTATE <input name="state" th:value="${editor.state}"></label><label>INDESC <textarea name="description" rows="4" th:text="${editor.description}"></textarea></label><label>INELIGIBLE <input name="eligible" type="number" min="0" max="1" th:value="${editor.eligible}"></label><label>INLRN400EN <input name="learn400" type="number" min="0" max="1" th:value="${editor.learn400}"></label><button name="action" value="save">F10 Save</button><button name="action" value="delete">F5 Delete</button><button name="action" value="delete" th:if="${deleteConfirm}" onclick="this.form.confirmed.value='true'">Confirm F5 Delete</button><input type="hidden" name="confirmed" value="false"></form>
<p><a th:href="@{/admin/exhibits(profile=${editor.profile})}">Load existing record</a></p>
</main><footer class="function-keys">F5=Delete F10=Save F12=Cancel</footer></div></body></html>
