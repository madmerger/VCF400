<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('ADMCREATE')}"></head>
<body><div class="screen"><header class="screen-header" th:text="#{ui.admin.exhibit.title}">ADMCREATE - 展示管理</header><main class="screen-body">
<p th:if="${result != null and result.message != null}" th:class="${result.success ? 'success' : 'error'}" th:text="${@uiMessageTranslator.tr(result.message)}"></p><p th:if="${deleteConfirm}" class="error" th:text="#{ui.admin.exhibit.confirm}">F5 で削除を確定してください。</p><h2 th:text="#{ui.admin.exhibit.list}">展示一覧</h2><ul><li th:each="exhibit : ${exhibits}" th:text="${exhibit.exhUsrPrf + ' - ' + exhibit.exhBtitle}"></li></ul>
<form method="post"><label>INUSRPRF <input name="profile" maxlength="9" th:value="${editor.profile}"></label><label>INTITLE <input name="title" maxlength="50" th:value="${editor.title}"></label><label>INNAME <input name="owner" maxlength="20" th:value="${editor.owner}"></label><label>INCITY <input name="city" maxlength="20" th:value="${editor.city}"></label><label>INSTATE <input name="state" maxlength="2" th:value="${editor.state}"></label><label>INDESC <textarea name="description" maxlength="1000" rows="4" th:text="${editor.description}"></textarea></label><label>INELIGIBLE <input name="eligible" type="number" min="0" max="1" th:value="${editor.eligible}"></label><label>INLRN400EN <input name="learn400" type="number" min="0" max="1" th:value="${editor.learn400}"></label><button name="action" value="save" th:text="#{ui.admin.exhibit.save}">F10 保存</button><button name="action" value="delete" th:text="#{ui.admin.exhibit.delete}">F5 削除</button><button name="action" value="delete" th:if="${deleteConfirm}" onclick="this.form.confirmed.value='true'" th:text="#{ui.admin.exhibit.confirm.delete}">F5 削除を確定</button><input type="hidden" name="confirmed" value="false"></form>
<p><a th:href="@{/admin/exhibits(profile=${editor.profile})}" th:text="#{ui.admin.exhibit.load}">既存レコードを読み込む</a></p>
</main><footer class="function-keys"><span th:text="#{ui.admin.exhibit.delete}">F5 削除</span> <span th:text="#{ui.admin.exhibit.save}">F10 保存</span> <a href="/" th:text="#{ui.f12.cancel}">F12=キャンセル</a></footer></div></body></html>
