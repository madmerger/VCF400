<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('MAINADMIN')}"></head>
<body><div class="screen"><header class="screen-header" th:text="#{ui.admin.learn.title}">MAINADMIN - LEARN/400 編集</header><main class="screen-body">
<p><span th:text="#{ui.learn.page}">ページ</span>: <strong th:text="${editor.outPageNbr}">1</strong></p><p th:if="${!editor.in60}" th:text="#{ui.admin.learn.new}">新規</p><form method="post" action="/admin/learn400"><label><span th:text="#{ui.learn.page}">ページ</span> <input name="page" type="number" th:value="${editor.curPageNbr}"></label><label><span th:text="#{ui.admin.learn.content}">本文</span> <textarea name="content" th:text="${editor.inContent}"></textarea></label><label><span th:text="#{ui.admin.learn.extra}">追加情報</span> <input name="extra" th:value="${editor.inExtra}"></label><button name="action" value="fwd" th:text="#{ui.admin.learn.fwd}">F5 次へ</button><button name="action" value="back" th:text="#{ui.admin.learn.back}">F8 前へ</button><button name="action" value="save" th:text="#{ui.admin.learn.save}">F10 保存</button></form>
</main><footer class="function-keys"><span th:text="#{ui.admin.learn.fwd}">F5 次へ</span> <span th:text="#{ui.admin.learn.back}">F8 前へ</span> <span th:text="#{ui.admin.learn.save}">F10 保存</span></footer></div></body></html>
