<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('MAINADMIN')}"></head>
<body><div class="screen"><header class="screen-header">MAINADMIN - LEARN/400 EDITOR</header><main class="screen-body">
<p>Page: <strong th:text="${editor.outPageNbr}">1</strong></p><p th:if="${!editor.in60}">NEW</p><form method="post" action="/admin/learn400"><label>Page <input name="page" type="number" th:value="${editor.curPageNbr}"></label><label>Content <textarea name="content" th:text="${editor.inContent}"></textarea></label><label>Extra <input name="extra" th:value="${editor.inExtra}"></label><button name="action" value="fwd">F5 Fwd</button><button name="action" value="back">F8 Back</button><button name="action" value="save">F10 Save</button></form>
</main><footer class="function-keys">F5=Fwd F8=Back F10=Save</footer></div></body></html>
