<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('VOTERES')}"></head>
<body><div class="screen"><header class="screen-header" th:text="#{ui.admin.votes.title}">VOTERES - 投票集計</header><main class="screen-body">
<form method="post"><label>INUSRPRF <input name="profile" th:value="${profile}"></label><button th:text="#{ui.admin.votes.read}">F5 読み込み</button></form>
<p th:if="${report != null and report.errLine != null}" class="error" th:text="${@uiMessageTranslator.tr(report.errLine)}"></p><dl th:if="${report != null}"><dt th:text="#{ui.admin.votes.exhibit}">展示名</dt><dd th:text="${report.outTitle}"></dd><dt th:text="#{ui.admin.votes.ed}">エド・フェア賞の票数</dt><dd th:text="${report.award2Count}"></dd><dt th:text="#{ui.admin.votes.best}">ベスト・イン・ショー賞の票数</dt><dd th:text="${report.award1Count}"></dd><dt th:text="#{ui.admin.votes.total}">DB内の投票数</dt><dd th:text="${report.totalVotes}"></dd></dl>
</main><footer class="function-keys"><a href="/" th:text="#{ui.f3.exit}">F3=終了</a></footer></div></body></html>
