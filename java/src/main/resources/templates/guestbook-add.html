<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ADDCMT')}"></head>
<body><div class="screen"><header class="screen-header" th:text="#{ui.guest.add.title}">VINTAGE COMPUTER FESTIVAL  GUESTBOOK/400 - コメントを追加</header><main class="screen-body">
<p th:if="${result != null and !result.success}" class="error" th:text="${@uiMessageTranslator.tr(result.errLine)}"></p>
<section th:if="${result != null and result.success}" class="success"><h2 th:text="#{ui.guest.end.title}">ENDCMT</h2><p><span th:text="#{ui.guest.end.message}">この展示へのコメントありがとうございます! あなたのコメント ID:</span> <span th:text="${result.commentId}"></span></p><p th:text="#{ui.guest.end.prompt}">Enter キーで終了します。</p><a class="button" href="/" th:text="#{ui.enter}">Enter</a></section>
<form th:if="${result == null or !result.success}" method="post" action="/guestbook/add"><input type="hidden" name="profile" th:value="${profile}"><label><span th:text="#{ui.vote.exhibit}">展示 ID</span> <input name="exhibitId" maxlength="9" th:value="${profile}" th:readonly="${profile != 'MM2024'}"></label><label><span th:text="#{ui.guest.name}">お名前</span> <input name="name" maxlength="20"></label><label><span th:text="#{ui.guest.comment}">コメント</span> <textarea name="comment" maxlength="200" rows="5"></textarea></label><button type="submit" th:text="#{ui.guest.submit}">F5 コメントを送信</button></form>
</main><footer class="function-keys"><span th:text="#{ui.f5.submit}">F5=送信</span> <a href="/" th:text="#{ui.f12.cancel}">F12=キャンセル</a></footer></div></body></html>
