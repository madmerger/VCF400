<!doctype html><html><head><title>ADDCMT</title><link rel="stylesheet" href="/vcf400.css"></head><body><h1>GUESTBOOK/400 - ADD COMMENT</h1>
<div id="err" class="err"></div><form id="commentForm"><input name="name" placeholder="Your name"><input name="exhibitId" th:value="${profile}" placeholder="Exhibit ID"><textarea name="comment" placeholder="Comment"></textarea><button>F5 Submit</button></form>
<script>commentForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(commentForm);const r=await fetch('/api/guestbook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:'[[${profile}]]',name:f.get('name'),exhibitId:f.get('exhibitId'),comment:f.get('comment')})});const x=await r.json();err.textContent=x.errLine||(x.success?'Thanks for commenting':'')}</script></body></html>
