<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('READCMT')}"></head>
<body><div class="screen"><header class="screen-header" th:text="#{ui.guest.read.title}">GUESTBOOK/400 - コメントを読む</header><main class="screen-body">
<p th:text="#{ui.guest.read.count(${totalCommentsDisplay})}">現在 0000 件のコメントを掲載中です。</p><p th:if="${result != null and !result.success}" class="error" th:text="${@uiMessageTranslator.tr(result.errLine)}"></p><section th:if="${result != null}"><p><strong th:text="${@uiMessageTranslator.tr(result.outName)}"></strong> <span th:text="#{ui.guest.read.says}">さんから〈展示名〉へ:</span> <span th:text="${result.outTitle}"></span></p><pre th:text="${@uiMessageTranslator.tr(result.outCmt)}"></pre></section>
<form method="post" action="/guestbook/read"><input type="hidden" name="profile" th:value="${profile}"><label><span th:text="#{ui.guest.read.id}">コメント ID を入力:</span> <input name="commentId" type="number" min="1" maxlength="4"></label><button type="submit" th:text="#{ui.f5.submit}">F5=送信</button></form>
</main><footer class="function-keys"><span th:text="#{ui.learn.next}">F5 次へ</span> <a href="/" th:text="#{ui.f12.cancel}">F12=キャンセル</a></footer></div></body></html>
