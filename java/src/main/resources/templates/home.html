<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('VCFMAIN')}"></head>
<body><div class="screen">
<header th:replace="~{fragments/screen :: header('VCFMAIN - VCF/400 MAIN MENU')}"></header>
<main class="screen-body">
<p>ログインユーザーを選択してください。</p>
<form method="post" action="/">
<label>ログインユーザー
<select name="profile">
<option value="ASHIBATA" th:selected="${profile == 'ASHIBATA'}">ASHIBATA</option>
<option value="DEMO400" th:selected="${profile == 'DEMO400'}">DEMO400</option>
<option value="NOVOTE" th:selected="${profile == 'NOVOTE'}">NOVOTE</option>
<option value="MM2024" th:selected="${profile == 'MM2024'}">MM2024</option>
</select>
</label>
<label>オプション番号 <input name="option" type="number" value="1" min="1"></label>
<button type="submit">Enter</button>
</form>
<nav class="menu-grid">
<a th:href="@{/learn400(owner=${profile})}">1 LEARN/400</a>
<a th:href="@{/help(next='/vote?profile=' + ${profile})}">11 Nominate</a>
<a th:href="@{/help(next='/guestbook/add?profile=' + ${profile})}">12 Sign Guestbook</a>
<a th:href="@{/help(next='/guestbook/read?profile=' + ${profile})}">13 Read Guestbook</a>
<a th:href="@{/menu(profile=${profile})}">80 Exhibit menu</a>
<a href="/admin">90 Admin</a>
</nav>
<p class="function-keys"><a href="/signon">F3/F12 サインオフ</a></p>
</main><footer th:replace="~{fragments/screen :: footer('F3=Exit F12=Cancel')}"></footer>
</div></body></html>
