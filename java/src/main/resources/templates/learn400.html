<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('MAIN')}"></head>
<body><div class="screen"><header class="screen-header" th:text="#{ui.learn.title}">MAIN - LEARN/400</header><main class="screen-body">
<p><span th:text="#{ui.learn.page}">ページ</span> <strong th:text="${learn.outPageNbr}">0001</strong></p><pre th:text="${learn.outContent}"></pre><p th:if="${learn.calledProgram != ''}"><span th:text="#{ui.learn.called}">呼び出しプログラム:</span> <span th:text="${learn.calledProgram}"></span></p><p th:if="${learn.ended}" class="success" th:text="#{ui.learn.end}">終了(END)</p>
<form method="post" action="/learn400"><input type="hidden" name="owner" th:value="${learn.owner}"><button name="action" value="fwd" th:text="#{ui.learn.next}">F5 次へ</button><button name="action" value="back" th:text="#{ui.learn.previous}">F8 前へ</button><button name="action" value="exit" th:text="#{ui.learn.exit}">F3 終了</button></form>
</main><footer class="function-keys"><span th:text="#{ui.learn.next}">F5 次へ</span> <span th:text="#{ui.learn.previous}">F8 前へ</span> <a href="/" th:text="#{ui.learn.exit}">F3 終了</a></footer></div></body></html>
