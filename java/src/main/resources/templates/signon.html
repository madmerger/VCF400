<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('SIGNON')}"></head>
<body><div class="screen">
<header class="screen-header" th:text="#{ui.signon.title}">VCF/400 サインオン</header>
<main class="screen-body">
<p th:text="#{ui.signon.signedoff}">サインオフしました。ログインユーザーを選択してください。</p>
<form method="post" action="/signon">
<label><span th:text="#{ui.vcfmain.login}">ログインユーザー</span>
<select name="profile">
<option value="ASHIBATA" th:selected="${profile == 'ASHIBATA'}">ASHIBATA</option>
<option value="DEMO400" th:selected="${profile == 'DEMO400'}">DEMO400</option>
<option value="NOVOTE" th:selected="${profile == 'NOVOTE'}">NOVOTE</option>
<option value="MM2024" th:selected="${profile == 'MM2024'}">MM2024</option>
</select>
</label>
<button type="submit" th:text="#{ui.enter}">Enter</button>
</form>
</main><footer th:replace="~{fragments/screen :: footer('ENTER=サインオン F12=キャンセル')}"></footer>
</div></body></html>
