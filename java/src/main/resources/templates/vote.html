<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('VOTE1')}"></head>
<body><div class="screen">
<header th:replace="~{fragments/screen :: header('VOTE1 - CAST YOUR VOTE')}"></header>
<main class="screen-body">
<p th:if="${result != null and result.errLine != null}"
   th:class="${result.success ? 'success' : 'error'}"
   th:text="${result.errLine}"></p>
<section th:if="${result != null and result.screen == 'VOTEEND'}" class="success"><pre>╔══════════════════════╗
║      THANK YOU       ║
╚══════════════════════╝</pre></section>
<section th:if="${result != null and result.screen == 'ENDOFCON'}" class="success"><pre>██████  SORRY!  ██████</pre></section>
<section th:if="${result == null or (result.screen != 'VOTEEND' and result.screen != 'ENDOFCON')}">
<p>You may only vote for ONE award.</p><form method="post" action="/vote"><input type="hidden" name="profile" th:value="${profile}"><label>Badge number <input name="badge" type="number" min="0"></label><label>Exhibit ID <input name="exhibitId" th:value="${profile}"></label><label>Award <select name="award"><option value="0">Select award</option><option value="1">001. Best in Show Award</option><option value="2">002. The Ed Fair Award</option></select></label><button type="submit">F5 Submit</button></form>
</section></main><footer th:replace="~{fragments/screen :: footer('F5=Submit F12=Cancel')}"></footer>
</div></body></html>
